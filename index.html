<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown 笔记阅读器</title>
  
  <!-- Highlight.js for code highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/src/css/style.css">
</head>
<body>
  <div class="app-container" id="app">
    <!-- Progress Bar -->
    <div class="progress-bar" id="progressBar" style="width: 0%"></div>

    <!-- Left Sidebar - Document List -->
    <aside class="sidebar-left" id="sidebarLeft">
      <div class="sidebar-header">
        <h2>文档列表</h2>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn-icon" id="btnRefresh" title="刷新 biji 文件夹">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
            </svg>
          </button>
          <button class="btn-icon" id="btnUploadDoc" title="上传文档">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
          </button>
          <button class="btn-icon" id="btnNewDoc" title="新建文档">+</button>
        </div>
      </div>
      <input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple style="display: none;">
      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索文档...">
      </div>
      <div class="document-list" id="documentList">
        <!-- Documents will be rendered here -->
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="toolbar">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <button class="mobile-menu-btn" id="mobileMenuBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <span class="toolbar-title" id="toolbarTitle">Markdown 阅读器</span>
        </div>
        <div class="toolbar-actions">
          <button class="btn-toolbar" id="btnEdit" title="编辑文档">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            编辑
          </button>
          <button class="btn-toolbar" id="btnExport" title="导出">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            导出
          </button>
          <button class="btn-toolbar" id="btnTheme" title="切换主题">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
            </svg>
          </button>
          <button class="btn-toolbar" id="btnToc" title="目录">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="reader-container" id="readerContainer">
        <div class="reader-content" id="readerContent">
          <div class="empty-state" id="emptyState">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <h3>选择一个文档开始阅读</h3>
            <p>从左侧列表选择文档，或点击 + 创建新文档</p>
          </div>
          <div class="markdown-body" id="markdownBody" style="display: none;"></div>
        </div>
      </div>
    </main>

    <!-- Right Sidebar - TOC -->
    <aside class="sidebar-right" id="sidebarRight">
      <div class="toc-header">
        <h3>目录</h3>
        <button class="btn-icon" id="btnCollapseToc" style="width: 28px; height: 28px; font-size: 1rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
      <div class="toc-list" id="tocList">
        <div class="toc-empty">暂无标题</div>
      </div>
    </aside>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-header">
        <h3>设置</h3>
        <button class="btn-icon" id="btnCloseSettings" style="width: 32px; height: 32px; font-size: 1rem; background: var(--hover-bg); color: var(--text-color);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="settings-content">
        <div class="setting-group">
          <label class="setting-label">字体大小</label>
          <div class="setting-options" id="fontSizeOptions">
            <button class="setting-btn" data-size="14">14px</button>
            <button class="setting-btn active" data-size="16">16px</button>
            <button class="setting-btn" data-size="18">18px</button>
            <button class="setting-btn" data-size="20">20px</button>
          </div>
        </div>
        <div class="setting-group">
          <label class="setting-label">行高</label>
          <div class="setting-options" id="lineHeightOptions">
            <button class="setting-btn" data-height="1.5">1.5</button>
            <button class="setting-btn active" data-height="1.8">1.8</button>
            <button class="setting-btn" data-height="2">2.0</button>
            <button class="setting-btn" data-height="2.2">2.2</button>
          </div>
        </div>
        <div class="setting-group">
          <label class="setting-label">页面宽度</label>
          <div class="setting-options" id="widthOptions">
            <button class="setting-btn" data-width="narrow">窄</button>
            <button class="setting-btn active" data-width="normal">正常</button>
            <button class="setting-btn" data-width="wide">宽</button>
          </div>
        </div>
        <div class="setting-group">
          <label class="setting-label">显示目录</label>
          <div class="setting-toggle">
            <div class="toggle-switch active" id="toggleToc"></div>
            <span>右侧目录栏</span>
          </div>
        </div>
        <div class="setting-group">
          <label class="setting-label">暗黑模式</label>
          <div class="setting-toggle">
            <div class="toggle-switch" id="toggleTheme"></div>
            <span>深色主题</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Floating Settings Button -->
    <button class="floating-btn" id="btnSettings" title="设置">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Modal for new document -->
    <div class="modal" id="modalNewDoc">
      <div class="modal-header">
        <h3>新建文档</h3>
      </div>
      <input type="text" class="modal-input" id="newDocTitle" placeholder="输入文档标题">
      <div class="modal-actions">
        <button class="btn-secondary" id="btnCancelNewDoc">取消</button>
        <button class="btn-primary" id="btnConfirmNewDoc">创建</button>
      </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="modalEdit" style="width: 90%; max-width: 800px;">
      <div class="modal-header">
        <h3>编辑文档</h3>
      </div>
      <textarea id="editContent" style="width: 100%; min-height: 400px; border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; background: var(--bg-color); color: var(--text-color); font-family: monospace; resize: vertical;"></textarea>
      <div class="modal-actions" style="margin-top: 1rem;">
        <button class="btn-secondary" id="btnCancelEdit">取消</button>
        <button class="btn-primary" id="btnSaveEdit">保存</button>
      </div>
    </div>
  </div>

  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <!-- Highlight.js for code highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <!-- Custom JS -->
  <script src="/src/js/app.js"></script>
</body>
</html>
