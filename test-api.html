<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>API 测试</title>
</head>
<body>
    <h1>API 测试</h1>
    <button onclick="testApi()">测试 API</button>
    <div id="result"></div>
    
    <script>
        async function testApi() {
            try {
                const response = await fetch('/api/biji-files');
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (e) {
                document.getElementById('result').innerHTML = 
                    `<pre>错误: ${e}</pre>`;
            }
        }
    </script>
</body>
</html>
