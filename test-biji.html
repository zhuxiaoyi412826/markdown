<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Biji 测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .doc-item { padding: 10px; border: 1px solid #ccc; margin: 5px; cursor: pointer; }
        .doc-item:hover { background: #f0f0f0; }
        pre { background: #f0f0f0; padding: 10px; }
    </style>
</head>
<body>
    <h1>Biji 文件夹测试</h1>
    <button onclick="loadBiji()">加载 biji 文档</button>
    <div id="docList"></div>
    <div id="content"></div>
    
    <script>
        let bijiFiles = [];
        
        async function fetchBijiFiles() {
            try {
                const response = await fetch('/api/biji-files');
                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.files) {
                        bijiFiles = data.files;
                        return true;
                    }
                }
            } catch (err) {
                console.error('获取文件列表失败:', err);
            }
            return false;
        }
        
        async function loadBiji() {
            const hasApi = await fetchBijiFiles();
            console.log('API 可用:', hasApi, '文件列表:', bijiFiles);
            
            if (hasApi && bijiFiles.length > 0) {
                const listDiv = document.getElementById('docList');
                listDiv.innerHTML = '<h3>文档列表:</h3>';
                
                for (const filename of bijiFiles) {
                    const item = document.createElement('div');
                    item.className = 'doc-item';
                    item.textContent = filename;
                    item.onclick = () => loadDoc(filename);
                    listDiv.appendChild(item);
                }
            }
        }
        
        async function loadDoc(filename) {
            try {
                const response = await fetch(`biji/${encodeURIComponent(filename)}`);
                if (response.ok) {
                    const content = await response.text();
                    document.getElementById('content').innerHTML = `
                        <h3>${filename}</h3>
                        <pre>${content.substring(0, 500)}...</pre>
                    `;
                }
            } catch (err) {
                console.error('加载文档失败:', err);
            }
        }
        
        // 页面加载时自动测试
        loadBiji();
    </script>
</body>
</html>
